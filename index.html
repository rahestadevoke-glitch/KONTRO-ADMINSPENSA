  --navy: #06383d; --navy-2: #0b7078; --tosca: #14b8a6; --gold: #e3b53c; --gold-soft: #f6e3a6;
  --ink: #10302f; --paper: #eaf6f5; --card: #ffffff; --line: #d3e7e4; --muted: #5f7a7a;
  --open: #1f7a4d; --open-bg: #dff1e6;
  --shut: #b4372d; --shut-bg: #f8e1de;
  --wait: #9a6200; --wait-bg: #fbecc9;
  --done: #4d5a6b; --done-bg: #e5e9ef;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: var(--paper); color: var(--ink); line-height: 1.5; min-height: 100vh; }
.hidden { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #14b8a6; outline-offset: 2px; }

/* logo mengkilap */
.logo { position: relative; width: var(--s, 64px); height: var(--s, 64px); flex-shrink: 0;
  background: var(--logo) center / contain no-repeat;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)) drop-shadow(0 0 14px rgba(227,181,60,.25)); }
.logo::before, .logo::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
.logo::before { background: linear-gradient(160deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 42%, rgba(0,0,0,.14) 100%); }
.logo::after { background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) 160% 0 / 260% 100% no-repeat;
  mix-blend-mode: soft-light; animation: shine 5.5s ease-in-out infinite; }
.logo.lg::after { mix-blend-mode: normal; opacity: .75; }
@keyframes shine { 0%, 55% { background-position: 160% 0; } 100% { background-position: -60% 0; } }

/* login */
#login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 20px;
  background: radial-gradient(900px 500px at 50% -10%, #14b8a6 0%, transparent 60%), linear-gradient(170deg, var(--navy-2) 0%, var(--navy) 70%); }
.login-card { width: 100%; max-width: 400px; background: rgba(255,255,255,.97); border-radius: 14px; padding: 34px 30px 30px; text-align: center;
  box-shadow: 0 30px 60px rgba(2,30,32,.45); border-top: 4px solid var(--gold); }
.login-card .logo { margin: -78px auto 14px; }
#login h1 { font-family: var(--serif); font-size: 27px; line-height: 1.2; color: var(--navy); margin-bottom: 4px; }
.school { font-size: 13px; font-weight: 600; color: var(--navy-2); margin-bottom: 14px; }
#login p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
.field { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 600; text-align: left; }
.field input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font-weight: 400; transition: border-color .2s, box-shadow .2s; }
.field input:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(20,184,166,.15); outline: 0; }
.btn { border: 0; background: linear-gradient(180deg, var(--navy-2), var(--navy)); color: #fff; font-weight: 600; padding: 11px 20px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.2); transition: filter .2s, transform .1s; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: default; }
#login .btn { width: 100%; padding: 13px; }
#login-err { color: var(--shut); font-size: 14px; margin-top: 12px; min-height: 20px; }

/* header */
header { background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff; position: relative; }
header::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-soft) 50%, var(--gold) 80%, transparent); }
.bar { max-width: 960px; margin: 0 auto; padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; }
.bar h1 { font-family: var(--serif); font-size: 21px; line-height: 1.2; }
.bar .school { color: var(--gold-soft); margin: 0; }
.bar small { display: block; opacity: .7; font-size: 12px; margin-top: 2px; }
.bar .acts { display: flex; gap: 8px; }
.bar .btn { background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); padding: 8px 14px; font-size: 14px; }
.bar .btn:hover { background: rgba(255,255,255,.2); filter: none; }

main { max-width: 960px; margin: 0 auto; padding: 22px 20px 60px; }
#q { width: 100%; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(6,56,61,.06); }
#q:focus { border-color: var(--navy-2); outline: 0; box-shadow: 0 0 0 3px rgba(20,184,166,.15); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* baris mapel */
.row { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(6,56,61,.06); }
.row:has(.st-BUKA)    { border-left-color: var(--open); }
.row:has(.st-TUTUP)   { border-left-color: var(--shut); }
.row:has(.st-BELUM)   { border-left-color: var(--wait); }
.row:has(.st-SELESAI) { border-left-color: var(--done); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.top strong { display: block; font-size: 17px; color: var(--navy); }
.top span.meta { color: var(--muted); font-size: 13px; }
.badge { flex-shrink: 0; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
.st-BUKA { background: var(--open-bg); color: var(--open); }
.st-TUTUP { background: var(--shut-bg); color: var(--shut); }
.st-BELUM { background: var(--wait-bg); color: var(--wait); }
.st-SELESAI { background: var(--done-bg); color: var(--done); }

.ctl { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 9px 14px; font-size: 14px; font-weight: 600; color: var(--muted); border-right: 1.5px solid var(--line); transition: background .2s, color .2s; }
.seg label:hover span { background: #eaf8f6; }
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: linear-gradient(180deg, var(--navy-2), var(--navy)); color: #fff; }
.seg input:focus-visible + span { outline: 3px solid #14b8a6; outline-offset: -3px; }
.dates { display: none; gap: 10px; flex-wrap: wrap; }
.row[data-mode="JADWAL"] .dates { display: flex; }
.dates label { font-size: 12px; font-weight: 600; color: var(--muted); }
.dates input { display: block; margin-top: 3px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font-size: 14px; color: var(--ink); }
.save { margin-left: auto; background: linear-gradient(180deg, #f0cb62, var(--gold)); color: #3b2c00; box-shadow: 0 2px 0 rgba(120,85,0,.25), inset 0 1px 0 rgba(255,255,255,.55); }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 8px; border-bottom: 3px solid var(--gold); font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; }
#toast.err { background: var(--shut); border-bottom-color: #f0a79f; }

@media (max-width: 560px) {
  .save { margin-left: 0; width: 100%; }
  .seg { width: 100%; } .seg label { flex: 1; text-align: center; }
  .seg span { padding: 9px 6px; }
}
@media (prefers-reduced-motion: reduce) { .logo::after { animation: none; opacity: 0; } }

/* ===== TEMA TOSCA MEWAH ===== */
body { background: radial-gradient(1000px 500px at 90% -5%, rgba(20,184,166,.14), transparent 60%), radial-gradient(800px 500px at -5% 105%, rgba(227,181,60,.12), transparent 60%), var(--paper); background-attachment: fixed; -webkit-text-size-adjust: 100%; }
#login { background: radial-gradient(800px 500px at 50% -10%, rgba(20,184,166,.55) 0%, transparent 62%), radial-gradient(600px 400px at 100% 100%, rgba(227,181,60,.18) 0%, transparent 60%), linear-gradient(170deg, #0b7078 0%, #06383d 62%, #04282c 100%); }
.login-card { border-top: 0; position: relative; backdrop-filter: blur(6px); box-shadow: 0 30px 60px rgba(2,30,32,.5), 0 0 0 1px rgba(227,181,60,.35); }
.login-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; border-radius: 14px 14px 0 0; background: linear-gradient(90deg, var(--tosca), var(--gold-soft), var(--gold), var(--gold-soft), var(--tosca)); }
#login h1 { background: linear-gradient(120deg, var(--navy-2), var(--tosca) 60%, var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
.login-card .school { letter-spacing: .06em; text-transform: uppercase; font-size: 12px; color: #a47a0c; }
header { background: linear-gradient(115deg, #04282c 0%, #06383d 35%, #0b7078 85%, #14a39b 100%); box-shadow: 0 12px 28px -16px rgba(2,30,32,.7); }
.bar .school { color: var(--gold-soft); letter-spacing: .04em; }
.btn { background: linear-gradient(180deg, #0f8f8a, var(--navy)); }
.seg input:checked + span { background: linear-gradient(180deg, #14a39b, var(--navy)); }
.row { border-top: 1px solid color-mix(in srgb, var(--tosca) 25%, var(--line)); transition: transform .25s, box-shadow .25s; }
.row:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -14px rgba(6,56,61,.35); }
.top strong { color: var(--navy-2); }
#toast { border-bottom-color: var(--gold); }

/* ===== MOBILE FRIENDLY ===== */
img, video { max-width: 100%; }
@media (max-width: 720px) {
  .bar { padding: 14px 14px; gap: 12px; }
  .brand { flex: 1 1 100%; }
  .bar .acts { flex: 1 1 100%; }
  .bar .acts .btn { flex: 1; padding: 11px 14px; }
  main { padding: 16px 14px 48px; }
  .row { padding: 16px 14px; }
  .top { flex-wrap: wrap; }
  .ctl { flex-direction: column; align-items: stretch; gap: 12px; }
  .dates { width: 100%; }
  .dates label { flex: 1 1 100%; }
  .dates input { width: 100%; }
}
@media (max-width: 560px) {
  input, .field input, #q, .dates input { font-size: 16px; }
  .login-card { padding: 30px 20px 24px; }
  .login-card .logo { --s: 112px !important; margin-top: -70px; }
  .bar h1 { font-size: 18px; }
  .brand .logo { --s: 52px !important; }
  .save { padding: 13px; }
  #toast { width: calc(100% - 28px); left: 14px; transform: none; bottom: 14px; text-align: center; }
}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <div class="logo lg" style="--s:132px" role="img" aria-label="Logo SMP Negeri 1 Cianjur"></div>
    <h1>Kontrol jadwal ujian</h1>
    <div class="school">SMP Negeri 1 Cianjur, Kab. Cianjur</div>
    <p>Masukkan password admin untuk mengatur kapan setiap kode mata pelajaran bisa dibuka siswa.</p>
    <label class="field">Password admin
      <input type="password" id="pw" autocomplete="current-password">
    </label>
    <button class="btn" id="btn-login">Masuk</button>
    <div id="login-err" role="alert"></div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand">
        <div class="logo" style="--s:62px" role="img" aria-label="Logo SMP Negeri 1 Cianjur"></div>
        <div>
          <h1>Kontrol jadwal ujian</h1>
          <div class="school">SMP Negeri 1 Cianjur, Kab. Cianjur</div>
          <small id="clock"></small>
        </div>
      </div>
      <div class="acts">
        <button class="btn" id="btn-refresh">Muat ulang</button>
        <button class="btn" id="btn-logout">Keluar</button>
      </div>
    </div>
  </header>
  <main>
    <input type="search" id="q" placeholder="Cari kode atau nama mata pelajaran" aria-label="Cari mata pelajaran">
    <div id="list"></div>
  </main>
</div>

<div id="toast" class="hidden" role="status"></div>

<script>
/* URL Apps Script SOAL (sama dengan GAS_URL_SOAL di PENAMPIL_SOAL.html) */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzzhNg4lbQtSAOprgmPkzqn48SJ1JMK_jwRmyEs_sRqILh9P4t2lV-IbOAvHGYyRfq5/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = { BUKA: 'Terbuka', TUTUP: 'Ditutup', BELUM: 'Belum dibuka', SELESAI: 'Sudah berakhir' };
let PASS = '', DATA = [], toastTimer;

function toast(msg, type) {
  const t = $('#toast');
  t.textContent = msg; t.className = type === 'err' ? 'err' : '';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 3200);
}

async function api(action, params = {}) {
  const ctl = new AbortController();
  const tid = setTimeout(() => ctl.abort(), 20000);
  try {
    const qs = new URLSearchParams({ action, pass: PASS, ...params });
    const res = await fetch(GAS_URL + '?' + qs, { signal: ctl.signal });
    return await res.json();
  } finally { clearTimeout(tid); }
}

async function load(fromLogin) {
  const btn = fromLogin ? $('#btn-login') : $('#btn-refresh');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Memuat…';
  try {
    const res = await api('adminList');
    if (!res.success) throw new Error(res.message || 'Gagal memuat data.');
    DATA = res.mapel;
    $('#clock').textContent = 'Waktu server ' + res.serverTime.replace('T', ' ') + ' WIB';
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    try { sessionStorage.setItem('adm', PASS); } catch (_) {}
    render();
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'Server tidak merespons. Coba lagi.' : (e.message || 'Periksa koneksi internet.');
    if (fromLogin) $('#login-err').textContent = msg; else toast(msg, 'err');
  } finally { btn.disabled = false; btn.textContent = label; }
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const items = DATA.filter(d => !q || (d.kode + ' ' + d.nama).toLowerCase().includes(q));
  if (!items.length) { $('#list').innerHTML = '<p class="empty">Tidak ada mata pelajaran yang cocok.</p>'; return; }
  $('#list').innerHTML = items.map((d, i) => `
    <article class="row" data-kode="${esc(d.kode)}" data-mode="${esc(d.mode)}">
      <div class="top">
        <div><strong>${esc(d.nama || 'Tanpa nama')}</strong><span class="meta">Kode ${esc(d.kode)}, ${d.jumlahSoal} soal</span></div>
        <span class="badge st-${esc(d.status)}">${STATUS[d.status] || esc(d.status)}</span>
      </div>
      <div class="ctl">
        <div class="seg" role="radiogroup" aria-label="Akses ${esc(d.nama)}">
          ${[['BUKA','Selalu buka'],['TUTUP','Tutup'],['JADWAL','Sesuai jadwal']].map(([v, t]) => `
          <label><input type="radio" name="m${i}" value="${v}" ${d.mode === v ? 'checked' : ''}><span>${t}</span></label>`).join('')}
        </div>
        <div class="dates">
          <label>Dibuka<input type="datetime-local" class="in-mulai" value="${esc(d.mulai)}"></label>
          <label>Ditutup<input type="datetime-local" class="in-selesai" value="${esc(d.selesai)}"></label>
        </div>
        <button class="btn save">Simpan</button>
      </div>
    </article>`).join('');
}

$('#list').addEventListener('change', e => {
  if (e.target.type === 'radio') e.target.closest('.row').dataset.mode = e.target.value;
});

$('#list').addEventListener('click', async e => {
  const btn = e.target.closest('.save'); if (!btn) return;
  const row = btn.closest('.row'), kode = row.dataset.kode;
  const mode = row.querySelector('input[type=radio]:checked').value;
  const mulai = row.querySelector('.in-mulai').value, selesai = row.querySelector('.in-selesai').value;
  if (mode === 'JADWAL' && (!mulai || !selesai)) return toast('Isi tanggal dibuka dan ditutup dulu.', 'err');
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    const res = await api('adminSave', { kode, mode, mulai: mode === 'JADWAL' ? mulai : '', selesai: mode === 'JADWAL' ? selesai : '' });
    if (!res.success) throw new Error(res.message || 'Gagal menyimpan.');
    const b = row.querySelector('.badge'); b.className = 'badge st-' + res.status; b.textContent = STATUS[res.status];
    const d = DATA.find(x => x.kode === kode);
    if (d) Object.assign(d, { mode, mulai: mode === 'JADWAL' ? mulai : '', selesai: mode === 'JADWAL' ? selesai : '', status: res.status });
    toast('Kode ' + kode + ' tersimpan.');
  } catch (err) {
    toast(err.name === 'AbortError' ? 'Server tidak merespons. Coba simpan lagi.' : (err.message || 'Gagal menyimpan. Periksa koneksi.'), 'err');
  } finally { btn.disabled = false; btn.textContent = 'Simpan'; }
});

$('#q').addEventListener('input', render);
$('#btn-refresh').addEventListener('click', () => load(false));
$('#btn-logout').addEventListener('click', () => {
  PASS = ''; try { sessionStorage.removeItem('adm'); } catch (_) {}
  $('#pw').value = ''; $('#login-err').textContent = '';
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
});
$('#btn-login').addEventListener('click', () => {
  PASS = $('#pw').value; $('#login-err').textContent = '';
  if (!PASS) return ($('#login-err').textContent = 'Masukkan password admin.');
  load(true);
});
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-login').click(); });

try { const s = sessionStorage.getItem('adm'); if (s) { PASS = s; load(true); } } catch (_) {}

</script>
</body>
</html>
